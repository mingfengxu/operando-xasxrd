[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "operando-xasxrd"
version = "0.1.0"
description = "Align semi-simultaneous operando XRD/XAS with electrochemistry and locate regime changes (PyTorch)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Mingfeng Xu"}]
dependencies = ["numpy", "pandas", "openpyxl", "matplotlib", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
